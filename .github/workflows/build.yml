name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile desktop targets
        run: >-
          ./gradlew
          :coreBottomBar:compileKotlinDesktop
          :basicBottomBar:compileKotlinDesktop
          :expandableBottomBar:compileKotlinDesktop
          :aztopiaBottomBar:compileKotlinDesktop
          :gooeyBottomBar:compileKotlinDesktop
          :tinyGlideBottomBar:compileKotlinDesktop
          :composeApp:compileKotlinDesktop
          --stacktrace

      - name: Run core tests
        run: ./gradlew :coreBottomBar:desktopTest --stacktrace

      - name: Build Android demo
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload Android demo
        uses: actions/upload-artifact@v4
        with:
          name: compose-app-debug
          path: composeApp/build/outputs/apk/debug/*.apk
